<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2D25" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Page Introuvable | Urunk</title>
    <meta name="description" content="The page you are looking for does not exist on Urunk Agency. Return to our homepage to find the direct booking web design and marketing solutions you need." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --color-primary: #0F2D25;
        --color-accent: #E5A85C;
        --color-bg: #FBF9F4;
        --color-text-dark: #1E302B;
        --color-text-light: #F1EFEA;
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        line-height: 1.5;
        text-align: center;
      }
      
      .container {
        max-width: 600px;
        width: 100%;
        background: #ffffff;
        padding: 3rem 2rem;
        border-radius: 24px;
        border: 1px solid rgba(15, 45, 37, 0.08);
        box-shadow: 0 10px 30px -10px rgba(15, 45, 37, 0.05);
      }
      
      .logo {
        margin-bottom: 2rem;
        display: inline-block;
      }
      
      .logo img {
        height: 40px;
        width: auto;
      }
      
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 5rem;
        font-weight: 700;
        color: var(--color-primary);
        line-height: 1;
        margin-bottom: 1rem;
      }
      
      h2 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--color-primary);
        margin-bottom: 1.5rem;
      }
      
      p {
        font-size: 1rem;
        color: rgba(30, 48, 43, 0.8);
        margin-bottom: 2.5rem;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        justify-content: center;
      }
      
      @media (min-width: 480px) {
        .btn-group {
          flex-direction: row;
        }
      }
      
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.875rem 1.75rem;
        border-radius: 50px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
      }
      
      .btn-primary {
        background-color: var(--color-primary);
        color: var(--color-text-light);
        border: 1px solid var(--color-primary);
      }
      
      .btn-primary:hover {
        background-color: #174237;
        border-color: #174237;
        transform: translateY(-2px);
      }
      
      .btn-secondary {
        background-color: #F1EFEA;
        color: var(--color-primary);
        border: 1px solid rgba(15, 45, 37, 0.1);
      }
      
      .btn-secondary:hover {
        background-color: #E7E4DD;
        transform: translateY(-2px);
      }
      
      .footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: rgba(30, 48, 43, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <a href="/">
          <img src="/logo.png" alt="Urunk Agency Logo" onerror="this.onerror=null; this.src='/logo.svg';" />
        </a>
      </div>
      
      <h1>404</h1>
      
      <h2>Page Not Found • Page Introuvable</h2>
      
      <p>
        The page you are looking for does not exist, or has been moved to another path. 
        <br /><br />
        La page que vous recherchez n'existe pas ou a été déplacée.
      </p>
      
      <div class="btn-group">
        <a href="/" class="btn btn-primary">Retour à l'accueil (FR)</a>
        <a href="/en" class="btn btn-secondary">Back to Home (EN)</a>
      </div>
    </div>
    
    <div class="footer">
      &copy; <span id="year">2026</span> Urunk. All rights reserved.
    </div>
    
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
